name: Build CV PDF
on:
  push:
    branches: [main]
    paths:
      - 'sarah_caulfield_cv.tex'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sarah_caulfield_cv.tex
      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build CV PDF"
          file_pattern: sarah_caulfield_cv.pdf
